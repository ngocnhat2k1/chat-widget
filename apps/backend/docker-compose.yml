version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: chat-widget-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_widget
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chat_widget"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
